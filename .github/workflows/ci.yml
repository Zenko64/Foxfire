name: "Ci"

on:
    pull_request:
    push:
        branches:
            - main
            
env:
    APP_URL: "http://localhost:5173"

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run lint:ci
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
